[package]
name = "xfina"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "xfina"
path = "src/main.rs"
required-features = ["cli"]

[workspace]
resolver = "2"
members = [
    "wasm",
    "python",
    "xtask"
]

[workspace.package]
version = "0.9.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/xfina-dev/xfina"
homepage = "https://xfina.dev"
description = "Fast, privacy-first parser for Indian financial statements (ReBIT/AA standard)"
readme = "README.md"
keywords = ["finance", "parser", "account-aggregator", "india", "pdf"]
categories = ["parsing", "finance", "data-structures"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
pdf-extract = "0.7"
csv = "1.3"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
serde_json = "1.0"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
serde_with = "3"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
calamine = "0.36"
rust_decimal = { version = "1.42", features = ["serde", "serde-with-float", "serde-with-str"] }
num-traits = "0.2"
chrono-tz = "0.10"
quick-xml = "0.41"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
regex = { workspace = true, optional = true }
# Required by src/models, which is compiled in every configuration.
chrono = { workspace = true }
pdf-extract = { workspace = true, optional = true }
csv = { workspace = true, optional = true }
calamine = { workspace = true, optional = true }
rust_decimal = { workspace = true }
num-traits = { workspace = true, optional = true }
chrono-tz = { workspace = true, optional = true }
quick-xml = { workspace = true, optional = true }

# CLI Dependencies
clap = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
thiserror = "2.0.19"

[features]
default = ["all"]
all = [
    "ba-hdfc", "ba-icici", "ba-sbi", "ba-bob", "ba-axis",
    "cc-hdfc", "cc-icici", "cc-axis",
    "mf-cams", "is-ibkr",
    "rt-sbi-forex-card",
    "md-amfi-nav", "md-nse-security", "md-nse-indices", "md-mcx-spot", "md-ishares",
    "md-tiingo", "md-wsj", "md-msci", "md-nasdaq", "md-yahoo", "md-spdr-gold",
]
cli = ["clap", "anyhow", "all"]

# Decoding capabilities, shared by the parsers that need them. A parser
# feature asks for a capability rather than a crate, so the decode layer can
# be gated on "can this build read a spreadsheet at all?".
_spreadsheet = ["calamine"]
_pdf = ["pdf-extract"]
# An HTML <table> saved under a spreadsheet's name (MCX), and Excel's XML
# Spreadsheet 2003 (iShares): both are text on disk, and calamine reads neither.
_html = []
_xmlss = ["quick-xml"]

# Bank Accounts
ba-hdfc = ["_spreadsheet", "regex"]
ba-icici = ["_spreadsheet", "regex"]
ba-sbi = ["_pdf", "regex"]
ba-bob = ["_spreadsheet", "regex"]
ba-axis = ["_spreadsheet", "regex"]

# Credit Cards
cc-hdfc = ["_spreadsheet", "regex", "num-traits"]
cc-icici = ["_spreadsheet", "csv", "regex", "num-traits"]
cc-axis = ["_spreadsheet", "regex", "num-traits"]

# Mutual Funds & International Stocks
mf-cams = ["_pdf", "regex"]
is-ibkr = ["csv", "chrono-tz"]

# Reference Rates
rt-sbi-forex-card = ["_pdf", "regex"]

# Market Data: public price, NAV and index history
md-amfi-nav = ["_spreadsheet"]
md-nse-security = ["csv"]
md-nse-indices = ["csv"]
md-mcx-spot = ["_html"]
md-ishares = ["_xmlss"]
md-tiingo = ["csv"]
md-wsj = ["csv"]
md-msci = ["_spreadsheet"]
md-nasdaq = ["_spreadsheet"]
md-yahoo = ["csv"]
md-spdr-gold = ["_spreadsheet"]

[dev-dependencies]
serde_json = { workspace = true }
# Builds the spreadsheet fixtures in memory, so the tests carry invented values
# in a publisher's layout rather than a publisher's file.
rust_xlsxwriter = "0.90"
